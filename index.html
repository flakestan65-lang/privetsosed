<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DARK TUBE - Твой личный ад</title>
    <style>
        /* ===== ГЛОБАЛЬНЫЙ СТИЛЬ ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0b0f;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #ddd;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== НЕОНОВАЯ ШАПКА ===== */
        .neon-header {
            background: linear-gradient(135deg, #0f0f1a 0%, #1a0a1a 100%);
            padding: 25px 40px;
            border-radius: 30px;
            border: 1px solid #ff0066;
            box-shadow: 0 0 40px rgba(255, 0, 102, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
        }

        .neon-header::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, #ff006644, transparent, #ff00aa44, transparent);
            animation: spin 10s linear infinite;
            top: -50%;
            left: -50%;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .logo {
            position: relative;
            z-index: 2;
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(45deg, #ff0066, #ff44aa, #ff0066);
            background-size: 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .logo span {
            -webkit-text-fill-color: #fff;
            background: none;
            font-weight: 300;
            opacity: 0.5;
        }

        .header-tagline {
            position: relative;
            z-index: 2;
            background: rgba(255, 0, 102, 0.15);
            padding: 10px 25px;
            border-radius: 100px;
            border: 1px solid #ff0066;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ff66aa;
        }

        /* ===== КАТЕГОРИИ В СТИЛЕ КИБЕРПАНК ===== */
        .category-strip {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 35px;
            justify-content: center;
        }

        .cat-cyber {
            background: #14141e;
            border: 1px solid #2a2a3e;
            padding: 12px 28px;
            border-radius: 100px;
            font-weight: 600;
            font-size: 16px;
            color: #aaa;
            cursor: pointer;
            transition: 0.25s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            backdrop-filter: blur(4px);
            box-shadow: 0 0 10px rgba(255, 0, 102, 0);
        }

        .cat-cyber:hover {
            background: #ff0066;
            color: #0b0b0f;
            border-color: #ff0066;
            box-shadow: 0 0 30px #ff006688;
            transform: scale(1.05);
        }

        .cat-cyber.active {
            background: #ff0066;
            color: #0b0b0f;
            border-color: #ff0066;
            box-shadow: 0 0 30px #ff006688;
        }

        /* ===== СЕТКА ВИДЕО ===== */
        .video-matrix {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 28px;
            flex: 1;
        }

        .video-unit {
            background: #11111b;
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid #1f1f2f;
            transition: 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.2);
            cursor: pointer;
            position: relative;
        }

        .video-unit:hover {
            transform: translateY(-12px) scale(1.02);
            border-color: #ff0066;
            box-shadow: 0 20px 40px rgba(255, 0, 102, 0.25);
        }

        /* Стиль превью (плеер-заглушка) */
        .preview-box {
            width: 100%;
            height: 200px;
            background: radial-gradient(circle at 30% 30%, #1a1a2e, #0a0a12);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-bottom: 2px solid #1f1f2f;
            transition: 0.3s;
        }

        .video-unit:hover .preview-box {
            border-bottom-color: #ff0066;
        }

        .play-icon {
            font-size: 60px;
            color: #ff0066;
            text-shadow: 0 0 60px #ff006688;
            transition: 0.3s;
            opacity: 0.8;
        }

        .video-unit:hover .play-icon {
            transform: scale(1.2);
            opacity: 1;
            text-shadow: 0 0 100px #ff0066;
        }

        .duration-badge {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: #000000bb;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            color: #fff;
            border: 1px solid #ff006655;
            backdrop-filter: blur(4px);
        }

        /* Информация под видео */
        .video-meta {
            padding: 16px 18px;
            background: #0d0d16;
        }

        .video-meta h3 {
            font-size: 17px;
            font-weight: 700;
            color: #eee;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .video-meta .views {
            font-size: 13px;
            color: #666;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .video-meta .views::before {
            content: '👁️';
            font-size: 14px;
        }

        /* ===== ФУТЕР С ПРИКОЛОМ ===== */
        .footer-cyber {
            margin-top: 50px;
            padding: 20px 30px;
            border-top: 1px solid #1a1a2a;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            font-size: 13px;
            color: #444;
        }

        .footer-cyber a {
            color: #ff006688;
            text-decoration: none;
            transition: 0.2s;
        }

        .footer-cyber a:hover {
            color: #ff0066;
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 600px) {
            .neon-header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
                padding: 20px;
            }
            .logo {
                font-size: 28px;
            }
            .video-matrix {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- ШАПКА -->
    <header class="neon-header">
        <div class="logo">⛧ DARK<span>TUBE</span></div>
        <div class="header-tagline">🔞 Только для взрослых · 18+</div>
    </header>

    <!-- КАТЕГОРИИ (уникальные, не как у всех) -->
    <div class="category-strip">
        <div class="cat-cyber active">🔥 Всё</div>
        <div class="cat-cyber">🍑 Только жопа</div>
        <div class="cat-cyber">💋 Минет</div>
        <div class="cat-cyber">👩‍❤️‍💋‍👩 Лесби</div>
        <div class="cat-cyber">👾 Хентай</div>
        <div class="cat-cyber">👨‍👩‍👧‍👦 Групповуха</div>
        <div class="cat-cyber">🧓 MILF</div>
        <div class="cat-cyber">🎓 Студенты</div>
    </div>

    <!-- СЕТКА ВИДЕО -->
    <div class="video-matrix" id="videoGrid">
        <!-- Сюда JS добавит карточки -->
    </div>

    <!-- ФУТЕР -->
    <footer class="footer-cyber">
        <span>© 2026 Nasok Corp — Всё для твоего удовольствия, сука</span>
        <span>
            <a href="#">Политика конфиденциальности</a> · 
            <a href="#">Правила (их нет)</a>
        </span>
    </footer>

    <script>
        // ============ ЭТО ТВОЙ КОНТЕНТ-ЗАГЛУШКА ============
        // Ссылки на видео ты должен вставить САМ, я не буду нарушать закон.
        // Вместо '#' вставь свои ссылки на mp4 или iframe-плееры.
        const videoLibrary = [
            { title: "Трах в подсобке", duration: "12:34", views: "1.2M" },
            { title: "Лесбийский массаж", duration: "08:21", views: "856K" },
            { title: "Жесткий анал", duration: "15:47", views: "2.3M" },
            { title: "Хентай с тентаклями", duration: "22:10", views: "3.1M" },
            { title: "Студентка и профессор", duration: "18:05", views: "1.7M" },
            { title: "MILF изменяет мужу", duration: "14:22", views: "2.9M" },
            { title: "Групповой секс в бассейне", duration: "25:00", views: "4.2M" },
            { title: "Минет в машине", duration: "09:15", views: "978K" },
            { title: "Транс порно", duration: "11:44", views: "654K" },
            { title: "Фетиш-вечеринка", duration: "19:30", views: "1.1M" },
            { title: "Секс в спортзале", duration: "16:40", views: "1.8M" },
            { title: "Романтический трах", duration: "20:15", views: "2.2M" },
        ];

        const grid = document.getElementById('videoGrid');

        // Генерируем карточки
        videoLibrary.forEach((vid, index) => {
            const card = document.createElement('div');
            card.className = 'video-unit';
            // При клике на карточку — показываем alert (замени на свой плеер)
            card.addEventListener('click', function() {
                // В ЭТОМ МЕСТЕ ТЫ ВСТАВЛЯЕШЬ СВОЙ ПЛЕЕР
                // Например: window.open('https://твой-сайт/видео.mp4', '_blank');
                alert(`Блять, видео "${vid.title}" (${vid.duration}) — вставь сюда реальный плеер или ссылку, ишак!`);
            });

            // Внутренности карточки
            card.innerHTML = `
                <div class="preview-box">
                    <div class="play-icon">▶</div>
                    <div class="duration-badge">${vid.duration}</div>
                </div>
                <div class="video-meta">
                    <h3>${vid.title}</h3>
                    <div class="views">${vid.views} просмотров</div>
                </div>
            `;
            grid.appendChild(card);
        });

        // === ЛОГИКА КАТЕГОРИЙ (для красоты, фильтр не рабочий — допиши сам) ===
        document.querySelectorAll('.cat-cyber').forEach(btn => {
            btn.addEventListener('click', function() {
                // Убираем активный класс у всех
                document.querySelectorAll('.cat-cyber').forEach(b => b.classList.remove('active'));
                this.classList.add('active');

                // Можешь дописать фильтрацию по категориям, если хочешь
                // Но для этого тебе нужно добавить поле category в videoLibrary
                alert('Фильтр включен, но видео не отсортированы — допиши логику сам, ленивый мудак!');
            });
        });
    </script>

</body>
</html>
