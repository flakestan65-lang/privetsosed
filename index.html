<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Hello Neighbor Mobile</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:none; }
html, body { width:100%; height:100%; overflow:hidden; background:#0a0a1a; font-family:Arial,sans-serif; user-select:none; }
#gameCanvas { position:fixed; top:0; left:0; width:100%; height:100%; z-index:1; }

/* Loading */
#loadingScreen { position:fixed; inset:0; z-index:1000; background:#1a1a2e; display:flex; flex-direction:column; align-items:center; justify-content:center; transition:opacity 0.5s; }
#loadingScreen.hidden { opacity:0; pointer-events:none; }
.load-title { font-size:2rem; font-weight:800; color:#ff6b6b; margin-bottom:8px; }
.load-sub { font-size:0.85rem; color:#888; margin-bottom:20px; }
.load-bar-bg { width:250px; height:6px; background:#333; border-radius:3px; overflow:hidden; }
.load-bar { width:0%; height:100%; background:#ff6b6b; transition:width 0.3s; }
.load-text { font-size:0.75rem; color:#666; margin-top:8px; }

/* Menu */
#mainMenu { position:fixed; inset:0; z-index:900; background:#1a1a2e; display:flex; flex-direction:column; align-items:center; justify-content:center; transition:opacity 0.5s; }
#mainMenu.hidden { opacity:0; pointer-events:none; }
.menu-title { font-size:2.5rem; font-weight:900; color:#e94560; margin-bottom:4px; text-align:center; }
.menu-sub { font-size:0.85rem; color:#888; margin-bottom:30px; }
.mbtn { width:200px; padding:12px 0; margin:5px 0; border:none; border-radius:10px; color:white; font-size:1rem; font-weight:700; cursor:pointer; }
.mbtn:active { transform:scale(0.95); }
.mbtn.p { background:#e94560; }
.mbtn.s { background:#533483; }
.mbtn.g { background:#2d3436; }

/* Settings */
#settingsPanel { position:fixed; inset:0; z-index:950; background:rgba(10,10,26,0.95); display:none; flex-direction:column; align-items:center; justify-content:center; }
#settingsPanel.active { display:flex; }
.set-title { font-size:1.5rem; color:#feca57; margin-bottom:20px; }
.set-row { width:260px; display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #333; }
.set-label { color:#ccc; font-size:0.9rem; }
.set-slider { width:100px; }
.set-toggle { width:44px; height:24px; background:#444; border-radius:12px; position:relative; cursor:pointer; }
.set-toggle.on { background:#00d2d3; }
.set-toggle::after { content:''; position:absolute; top:2px; left:2px; width:20px; height:20px; background:white; border-radius:50%; transition:transform 0.2s; }
.set-toggle.on::after { transform:translateX(20px); }

/* HUD */
#hud { position:fixed; inset:0; z-index:10; pointer-events:none; display:none; }
#hud.on { display:block; }
.noise-bg { position:absolute; top:10px; left:50%; transform:translateX(-50%); width:140px; height:16px; background:rgba(0,0,0,0.6); border-radius:8px; overflow:hidden; border:1px solid rgba(255,255,255,0.2); }
.noise-fill { width:0%; height:100%; background:linear-gradient(90deg,#0f0,#ff0,#f00); transition:width 0.2s; }
.noise-lbl { position:absolute; top:28px; left:50%; transform:translateX(-50%); font-size:0.6rem; color:#888; }
.hp-box { position:absolute; top:10px; left:10px; }
.hp-txt { font-size:0.8rem; color:#ff6b6b; font-weight:700; }
.item-box { position:absolute; bottom:90px; right:10px; width:50px; height:50px; background:rgba(0,0,0,0.5); border:2px solid rgba(255,255,255,0.3); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:0.9rem; color:white; }
#notifArea { position:absolute; top:50px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:4px; }
.notif { background:rgba(0,0,0,0.8); color:#fff; padding:6px 12px; border-radius:6px; font-size:0.8rem; border-left:3px solid #feca57; max-width:260px; text-align:center; animation:fadeIn 0.3s; }
.notif.bad { border-left-color:#ff6b6b; color:#ff6b6b; }
.notif.good { border-left-color:#0f0; color:#0f0; }
@keyframes fadeIn { from{opacity:0;transform:translateY(-10px);} to{opacity:1;transform:translateY(0);} }

/* Screens */
#caughtScreen { position:fixed; inset:0; z-index:800; background:rgba(100,0,0,0.9); display:none; flex-direction:column; align-items:center; justify-content:center; }
#caughtScreen.on { display:flex; }
.caught-t { font-size:2rem; color:#fff; font-weight:900; }
.caught-s { font-size:0.9rem; color:#faa; margin:10px 0 20px; }
#pauseMenu { position:fixed; inset:0; z-index:150; background:rgba(10,10,26,0.9); display:none; flex-direction:column; align-items:center; justify-content:center; }
#pauseMenu.on { display:flex; }
.pause-t { font-size:1.8rem; color:#fff; margin-bottom:20px; }

/* Controls */
#stickZone { position:fixed; bottom:15px; left:15px; z-index:20; width:130px; height:130px; pointer-events:auto; }
.stick-bg { position:absolute; width:110px; height:110px; background:rgba(255,255,255,0.15); border:2px solid rgba(255,255,255,0.3); border-radius:50%; left:10px; top:10px; }
.stick-knob { position:absolute; width:44px; height:44px; background:rgba(255,255,255,0.5); border-radius:50%; left:43px; top:43px; pointer-events:none; }
#camZone { position:fixed; top:0; right:0; width:60%; height:65%; z-index:5; pointer-events:auto; }
#actBtns { position:fixed; bottom:15px; right:10px; z-index:20; display:grid; grid-template-columns:repeat(2,55px); gap:6px; pointer-events:auto; }
.abtn { width:55px; height:55px; background:rgba(255,255,255,0.15); border:2px solid rgba(255,255,255,0.3); border-radius:50%; color:white; font-size:0.75rem; display:flex; align-items:center; justify-content:center; cursor:pointer; font-weight:bold; }
.abtn:active { background:rgba(255,255,255,0.4); transform:scale(0.92); }
.abtn.on { background:rgba(0,210,211,0.4); border-color:#00d2d3; }
.abtn.wide { grid-column:1/3; width:116px; border-radius:25px; font-size:0.7rem; }

/* Inventory */
#invPanel { position:fixed; inset:0; z-index:100; background:rgba(10,10,26,0.95); display:none; flex-direction:column; align-items:center; justify-content:center; }
#invPanel.on { display:flex; }
.inv-t { font-size:1.4rem; color:#feca57; margin-bottom:15px; }
.inv-g { display:grid; grid-template-columns:repeat(4,60px); gap:6px; }
.inv-s { width:60px; height:60px; background:rgba(255,255,255,0.1); border:2px solid rgba(255,255,255,0.2); border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:0.9rem; color:white; cursor:pointer; }
.inv-s.sel { border-color:#feca57; background:rgba(254,202,87,0.2); }
.inv-a { margin-top:15px; display:flex; gap:10px; }
.inv-btn { padding:8px 20px; background:#e94560; border:none; border-radius:6px; color:white; font-size:0.8rem; font-weight:700; cursor:pointer; }
.inv-btn.u { background:#00d2d3; }

/* Misc */
#crosshair { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); width:16px; height:16px; z-index:15; pointer-events:none; }
#crosshair::before { content:''; position:absolute; width:2px; height:12px; background:rgba(255,255,255,0.5); left:7px; top:2px; }
#crosshair::after { content:''; position:absolute; width:12px; height:2px; background:rgba(255,255,255,0.5); left:2px; top:7px; }
#fps { position:fixed; top:10px; right:10px; z-index:30; font-size:0.65rem; color:#0f0; font-family:monospace; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
</head>
<body>
<div id="loadingScreen">
  <div class="load-title">HELLO NEIGHBOR</div>
  <div class="load-sub">Mobile Edition</div>
  <div class="load-bar-bg"><div class="load-bar" id="loadBar"></div></div>
  <div class="load-text" id="loadText">Loading...</div>
</div>

<div id="mainMenu">
  <div class="menu-title">HELLO<br>NEIGHBOR</div>
  <div class="menu-sub">Mobile Edition</div>
  <button class="mbtn p" id="btnPlay">PLAY</button>
  <button class="mbtn s" id="btnControls">CONTROLS</button>
  <button class="mbtn g" id="btnSettings">SETTINGS</button>
</div>

<div id="settingsPanel">
  <div class="set-title">SETTINGS</div>
  <div class="set-row"><span class="set-label">Sensitivity</span><input type="range" class="set-slider" id="sensSlider" min="1" max="10" value="5"></div>
  <div class="set-row"><span class="set-label">Volume</span><input type="range" class="set-slider" id="volSlider" min="0" max="10" value="7"></div>
  <div class="set-row"><span class="set-label">High Quality</span><div class="set-toggle on" id="togQuality"></div></div>
  <div class="set-row"><span class="set-label">Shadows</span><div class="set-toggle on" id="togShadows"></div></div>
  <div class="set-row"><span class="set-label">Vibration</span><div class="set-toggle on" id="togVibro"></div></div>
  <button class="mbtn p" style="margin-top:20px;width:180px;" id="btnSetBack">BACK</button>
</div>

<div id="hud">
  <div class="noise-bg"><div class="noise-fill" id="noiseFill"></div></div>
  <div class="noise-lbl">NOISE</div>
  <div class="hp-box"><span class="hp-txt" id="hpText">100%</span></div>
  <div class="item-box" id="itemHand">--</div>
  <div id="notifArea"></div>
  <div id="crosshair"></div>
  <div id="fps">FPS: --</div>
</div>

<div id="stickZone">
  <div class="stick-bg"></div>
  <div class="stick-knob" id="stickKnob"></div>
</div>

<div id="camZone"></div>

<div id="actBtns">
  <div class="abtn" id="btnJump">JUMP</div>
  <div class="abtn" id="btnCrouch">CRCH</div>
  <div class="abtn" id="btnUse">USE</div>
  <div class="abtn" id="btnInv">INV</div>
  <div class="abtn wide" id="btnFlash">FLASH</div>
</div>

<div id="invPanel">
  <div class="inv-t">INVENTORY</div>
  <div class="inv-g" id="invGrid"></div>
  <div class="inv-a">
    <button class="inv-btn u" id="btnUseItem">USE</button>
    <button class="inv-btn" id="btnDropItem">DROP</button>
    <button class="inv-btn" style="background:#533483" id="btnCloseInv">CLOSE</button>
  </div>
</div>

<div id="caughtScreen">
  <div class="caught-t">CAUGHT!</div>
  <div class="caught-s">The neighbor got you!</div>
  <button class="mbtn p" id="btnRespawn">RESPAWN</button>
</div>

<div id="pauseMenu">
  <div class="pause-t">PAUSED</div>
  <button class="mbtn p" id="btnResume">RESUME</button>
  <button class="mbtn s" id="btnRestart">RESTART</button>
  <button class="mbtn g" id="btnQuit">QUIT</button>
</div>

<script>
// ===== CORE ENGINE =====
let scene, camera, renderer, world;
let playerMesh, playerBody;
let neighborMesh, neighborBody;
let flashLight;
let isRunning = false;
let isPaused = false;
let audioCtx = null;

// Settings
let cfg = {
  sens: 5,
  vol: 0.7,
  shadows: true,
  vibrate: true,
  fps: 30
};

// Input
let stick = { active: false, dx: 0, dy: 0, ox: 0, oy: 0 };
let camTouch = { active: false, lx: 0, ly: 0 };
let rotY = 0, rotX = 0;
let keys = {};

// Game state
let hp = 100;
let noise = 0;
let crouching = false;
let sprinting = false;
let canJump = true;
let flashOn = false;

// Inventory
let inv = [];
let selSlot = -1;
const MAX_SLOTS = 12;

// Neighbor AI
let nState = 'patrol'; // patrol, alert, chase, return
let nPatrol = 0;
let nSuspicion = 0;
let nChaseTimer = 0;
let nLastPos = null;
let nTraps = [];

// World
let allDoors = [];
let allItems = [];
let allBoxes = [];

// Timing
let lastT = 0;
let fpsCount = 0;
let fpsAccum = 0;

// ===== INIT =====
function init() {
  loadProgress(10, 'Init renderer...');

  // Scene
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a1a);
  scene.fog = new THREE.Fog(0x0a0a1a, 8, 50);

  // Camera
  camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 100);

  // Renderer - mobile optimized
  renderer = new THREE.WebGLRenderer({ 
    antialias: false, 
    powerPreference: 'low-power',
    alpha: false
  });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
  renderer.shadowMap.enabled = cfg.shadows;
  if (cfg.shadows) renderer.shadowMap.type = THREE.BasicShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  document.body.appendChild(renderer.domElement);
  renderer.domElement.id = 'gameCanvas';

  loadProgress(20, 'Physics...');

  // Physics
  world = new CANNON.World();
  world.gravity.set(0, -15, 0);
  world.broadphase = new CANNON.NaiveBroadphase();
  world.solver.iterations = 3;

  // Materials
  const physMat = new CANNON.Material('phys');
  const groundMat = new CANNON.Material('ground');
  world.addContactMaterial(new CANNON.ContactMaterial(groundMat, physMat, {
    friction: 0.0,
    restitution: 0.0
  }));

  loadProgress(30, 'World...');
  buildWorld();

  loadProgress(50, 'Player...');
  buildPlayer();

  loadProgress(60, 'Neighbor...');
  buildNeighbor();

  loadProgress(70, 'Lights...');
  buildLights();

  loadProgress(80, 'UI...');
  buildInventory();
  setupEvents();
  setupAudio();

  loadProgress(100, 'Ready!');

  setTimeout(() => {
    document.getElementById('loadingScreen').classList.add('hidden');
  }, 400);

  // Start loop
  requestAnimationFrame(loop);
}

function loadProgress(pct, msg) {
  document.getElementById('loadBar').style.width = pct + '%';
  document.getElementById('loadText').textContent = msg;
}

// ===== WORLD BUILDING =====
function buildWorld() {
  // Materials
  const M = {
    grass: new THREE.MeshLambertMaterial({ color: 0x2d5016 }),
    wall: new THREE.MeshLambertMaterial({ color: 0xC4A77D }),
    floor: new THREE.MeshLambertMaterial({ color: 0x6B4423 }),
    floor2: new THREE.MeshLambertMaterial({ color: 0x8B6914 }),
    roof: new THREE.MeshLambertMaterial({ color: 0x4a3728 }),
    win: new THREE.MeshLambertMaterial({ color: 0x87CEEB, transparent: true, opacity: 0.5 }),
    door: new THREE.MeshLambertMaterial({ color: 0x5C4033 }),
    fence: new THREE.MeshLambertMaterial({ color: 0x8B4513 }),
    road: new THREE.MeshLambertMaterial({ color: 0x555555 }),
    tree: new THREE.MeshLambertMaterial({ color: 0x1a472a }),
    trunk: new THREE.MeshLambertMaterial({ color: 0x4a3728 })
  };

  // Ground
  const g = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), M.grass);
  g.rotation.x = -Math.PI / 2;
  g.receiveShadow = true;
  scene.add(g);

  const gb = new CANNON.Body({ mass: 0, material: new CANNON.Material('ground') });
  gb.addShape(new CANNON.Plane());
  gb.quaternion.setFromAxisAngle(new CANNON.Vec3(1,0,0), -Math.PI/2);
  world.addBody(gb);

  // Road
  const road = new THREE.Mesh(new THREE.PlaneGeometry(100, 8), M.road);
  road.rotation.x = -Math.PI / 2;
  road.position.set(0, 0.01, 20);
  scene.add(road);

  // House group
  const house = new THREE.Group();
  scene.add(house);

  const W = 10, D = 8, H = 3.5;
  const F2 = 3.5;

  // Foundation
  const fnd = new THREE.Mesh(new THREE.BoxGeometry(W+0.4, 0.3, D+0.4), new THREE.MeshLambertMaterial({color:0x555555}));
  fnd.position.y = 0.15;
  house.add(fnd);

  // Helper: add wall with physics
  function addWall(x, y, z, w, h, d, mat) {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    mesh.position.set(x, y, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    house.add(mesh);
    const body = new CANNON.Body({ mass: 0 });
    body.addShape(new CANNON.Box(new CANNON.Vec3(w/2, h/2, d/2)), new CANNON.Vec3(x, y, z));
    world.addBody(body);
  }

  // 1st floor walls
  addWall(-W/2, 1.75, 0, 0.2, H, D, M.wall);
  addWall(W/2, 1.75, 0, 0.2, H, D, M.wall);
  addWall(0, 1.75, -D/2, W, H, 0.2, M.wall);
  addWall(0, 1.75, D/2, W, H, 0.2, M.wall);
  addWall(0, 1.75, 0, 0.15, H, D, M.wall);
  addWall(-2.5, 1.75, 2, 5, H, 0.15, M.wall);

  // 2nd floor walls
  addWall(-W/2, 1.75+H, 0, 0.2, H, D, M.wall);
  addWall(W/2, 1.75+H, 0, 0.2, H, D, M.wall);
  addWall(0, 1.75+H, -D/2, W, H, 0.2, M.wall);
  addWall(0, 1.75+H, D/2, W, H, 0.2, M.wall);
  addWall(2, 1.75+H, 0, 0.15, H, D, M.wall);

  // Floors
  const fl1 = new THREE.Mesh(new THREE.BoxGeometry(W, 0.2, D), M.floor);
  fl1.position.y = 0;
  house.add(fl1);
  const fl2 = new THREE.Mesh(new THREE.BoxGeometry(W, 0.2, D), M.floor2);
  fl2.position.y = F2;
  house.add(fl2);
  const fl3 = new THREE.Mesh(new THREE.BoxGeometry(W, 0.2, D), M.floor);
  fl3.position.y = F2+H;
  house.add(fl3);

  // Roof
  const roof = new THREE.Mesh(new THREE.ConeGeometry(7, 3, 4), M.roof);
  roof.position.y = F2 + H + 1.5;
  roof.rotation.y = Math.PI / 4;
  roof.scale.set(1, 0.6, 1.3);
  house.add(roof);

  // Garage
  const gW = 5, gD = 6;
  addWall(W/2 + gW/2, 1.5, -1, gW, 3, 0.2, M.wall);
  addWall(W/2 + gW, 1.5, -1+gD/2, 0.2, 3, gD, M.wall);
  addWall(W/2 + gW/2, 1.5, -1+gD, gW, 3, 0.2, M.wall);
  const gf = new THREE.Mesh(new THREE.BoxGeometry(gW, 0.2, gD), new THREE.MeshLambertMaterial({color:0x666666}));
  gf.position.set(W/2 + gW/2, 0, -1 + gD/2);
  house.add(gf);

  // Doors
  allDoors.push(makeDoor(W/2 + gW/2, 1.5, -1+gD-0.1, gW-0.4, 2.5, 0.1, M.door, 'garage'));
  allDoors.push(makeDoor(0, 1.25, D/2, 1.2, 2.5, 0.1, M.door, 'front'));
  allDoors.push(makeDoor(-2.5, 1.25, 2, 1, 2.5, 0.1, M.door, 'kitchen'));
  allDoors.push(makeDoor(2, 1.25+F2, 0, 1, 2.5, 0.1, M.door, 'bedroom'));
  allDoors.push(makeDoor(4, 1.25, 0, 1, 2.5, 0.1, new THREE.MeshLambertMaterial({color:0x330000}), 'basement', true));
  const attic = makeDoor(0, F2+H-0.1, 0, 1.5, 1.5, 0.1, M.door, 'attic');
  attic.mesh.rotation.x = Math.PI/2;
  allDoors.push(attic);

  // Windows
  [[-3,2.5,D/2],[3,2.5,D/2],[-W/2,2.5,-2],[-W/2,2.5,2],[W/2,2.5,-2],[W/2,2.5,2],[-3,6,D/2],[3,6,D/2],[W/2+gW,2,-1+gD/2]].forEach(p => {
    const w = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 0.1), M.win);
    w.position.set(...p);
    if (Math.abs(p[0]) > W/2 - 0.5) w.rotation.y = Math.PI/2;
    house.add(w);
  });

  // Fence
  for (let x = -20; x <= 20; x += 2) {
    if (Math.abs(x) > 2) {
      const p = new THREE.Mesh(new THREE.BoxGeometry(0.15, 2, 0.15), M.fence);
      p.position.set(x, 1, 12); scene.add(p);
      const pan = new THREE.Mesh(new THREE.BoxGeometry(2, 1.5, 0.05), M.fence);
      pan.position.set(x+1, 0.75, 12); scene.add(pan);
    }
  }
  for (let z = -10; z <= 12; z += 2) {
    const p1 = new THREE.Mesh(new THREE.BoxGeometry(0.15, 2, 0.15), M.fence);
    p1.position.set(-20, 1, z); scene.add(p1);
    const p2 = new THREE.Mesh(new THREE.BoxGeometry(0.15, 2, 0.15), M.fence);
    p2.position.set(20, 1, z); scene.add(p2);
  }

  // Trees
  [[-15,-8],[18,-5],[-12,5],[15,8],[-18,-2],[22,2]].forEach(p => {
    const t = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 2, 6), M.trunk);
    t.position.set(p[0], 1, p[1]); scene.add(t);
    const l = new THREE.Mesh(new THREE.ConeGeometry(2, 4, 6), M.tree);
    l.position.set(p[0], 3.5, p[1]); scene.add(l);
  });

  // Furniture
  makeFurniture(new THREE.BoxGeometry(2, 0.1, 1), new THREE.MeshLambertMaterial({color:0x8B4513}), -3.5, 0.5, 1, 'table');
  makeFurniture(new THREE.BoxGeometry(0.4, 0.8, 0.4), new THREE.MeshLambertMaterial({color:0x654321}), -3, 0.4, 1.5, 'chair');
  makeFurniture(new THREE.BoxGeometry(1, 2, 0.8), new THREE.MeshLambertMaterial({color:0xCCCCCC}), -4.5, 1, -2.5, 'fridge', true);
  const tv = makeFurniture(new THREE.BoxGeometry(1.5, 0.9, 0.3), new THREE.MeshLambertMaterial({color:0x111111}), 3, 1.2, 3, 'tv');
  const ts = new THREE.Mesh(new THREE.PlaneGeometry(1.3, 0.7), new THREE.MeshBasicMaterial({color:0x4444ff}));
  ts.position.set(0, 0, 0.16); tv.add(ts);
  makeFurniture(new THREE.BoxGeometry(2, 0.6, 1.5), new THREE.MeshLambertMaterial({color:0x4169E1}), 3.5, F2+0.3, -2, 'bed');
  makeFurniture(new THREE.BoxGeometry(2.5, 0.6, 1), new THREE.MeshLambertMaterial({color:0x8B0000}), 0, 0.3, 3, 'sofa');

  // Physics boxes
  for (let i = 0; i < 5; i++) {
    const b = makeBox((Math.random()-0.5)*6, 1, (Math.random()-0.5)*6, 0.4);
    allBoxes.push(b);
  }

  // Collectible items
  makeItem(-4, 0.5, 3, 'KEY', 'Basement Key', 'basement_key');
  makeItem(3.5, F2+0.5, -1, 'WRENCH', 'Wrench', 'wrench');
  makeItem(0, 0.5, -3, 'FLASH', 'Flashlight', 'flashlight');
  makeItem(-3.5, F2+0.5, 2, 'PICK', 'Lockpick', 'lockpick');
  makeItem(4.5, 1.5, 2, 'HAMMER', 'Hammer', 'hammer');

  // Traps
  makeTrap(2, 0.1, 2);
  makeTrap(-2, F2+0.1, -1);
}

function makeDoor(x, y, z, w, h, d, mat, id, locked) {
  locked = locked || false;
  const g = new THREE.Group();
  g.position.set(x, y, z);
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.castShadow = true;
  g.add(m);
  const hnd = new THREE.Mesh(new THREE.SphereGeometry(0.08), new THREE.MeshLambertMaterial({color:0xFFD700}));
  hnd.position.set(w/2-0.15, 0, d/2+0.05);
  g.add(hnd);
  scene.add(g);
  return { mesh: g, id: id, open: false, locked: locked, angle: 0, targetAngle: 0, pos: new THREE.Vector3(x, y, z) };
}

function makeFurniture(geo, mat, x, y, z, type, interactive) {
  interactive = interactive || false;
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  scene.add(m);
  const b = new CANNON.Body({ mass: 0 });
  const box = new THREE.Box3().setFromObject(m);
  const sz = new THREE.Vector3();
  box.getSize(sz);
  b.addShape(new CANNON.Box(new CANNON.Vec3(sz.x/2, sz.y/2, sz.z/2)), new CANNON.Vec3(x, y, z));
  world.addBody(b);
  if (interactive) allItems.push({ mesh: m, body: b, type: type, name: type });
  return m;
}

function makeBox(x, y, z, s) {
  const geo = new THREE.BoxGeometry(s, s, s);
  const mat = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  scene.add(m);
  const b = new CANNON.Body({ mass: 3 });
  b.addShape(new CANNON.Box(new CANNON.Vec3(s/2, s/2, s/2)));
  b.position.set(x, y, z);
  world.addBody(b);
  return { mesh: m, body: b };
}

function makeItem(x, y, z, emoji, name, id) {
  const c = document.createElement('canvas');
  c.width = 128; c.height = 64;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#222';
  ctx.fillRect(0, 0, 128, 64);
  ctx.fillStyle = '#0f0';
  ctx.font = 'bold 14px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(emoji, 64, 32);
  const tex = new THREE.CanvasTexture(c);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex }));
  s.position.set(x, y + 0.3, z);
  s.scale.set(0.6, 0.3, 1);
  scene.add(s);
  const l = new THREE.PointLight(0xffff00, 0.5, 2);
  l.position.set(x, y + 0.5, z);
  scene.add(l);
  allItems.push({ 
    mesh: s, light: l, pos: new THREE.Vector3(x, y, z),
    emoji: emoji, name: name, id: id, 
    collected: false, isItem: true 
  });
}

function makeTrap(x, y, z) {
  const t = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.1, 0.8), new THREE.MeshLambertMaterial({ color: 0x8B0000 }));
  t.position.set(x, y, z);
  scene.add(t);
  nTraps.push({ mesh: t, pos: new THREE.Vector3(x, y, z), active: true });
}

// ===== INVENTORY =====
function buildInventory() {
  const grid = document.getElementById('invGrid');
  for (let i = 0; i < MAX_SLOTS; i++) {
    const s = document.createElement('div');
    s.className = 'inv-s';
    s.dataset.idx = i;
    s.addEventListener('click', () => selectSlot(i));
    grid.appendChild(s);
  }
}

function selectSlot(i) {
  document.querySelectorAll('.inv-s').forEach(s => s.classList.remove('sel'));
  if (inv[i]) {
    document.querySelectorAll('.inv-s')[i].classList.add('sel');
    selSlot = i;
  } else selSlot = -1;
}

function addInv(item) {
  for (let i = 0; i < MAX_SLOTS; i++) {
    if (!inv[i]) {
      inv[i] = item;
      updateInv();
      notify('Picked up: ' + item.name, 'good');
      playSnd('pickup');
      return true;
    }
  }
  notify('Inventory full!', 'bad');
  return false;
}

function updateInv() {
  document.querySelectorAll('.inv-s').forEach((s, i) => {
    s.innerHTML = '';
    s.classList.remove('sel');
    if (inv[i]) {
      s.textContent = inv[i].emoji;
      if (inv[i].count > 1) s.innerHTML += '<span style="position:absolute;bottom:2px;right:4px;font-size:0.6rem;">' + inv[i].count + '</span>';
    }
  });
  if (selSlot >= 0 && inv[selSlot]) {
    document.querySelectorAll('.inv-s')[selSlot].classList.add('sel');
    document.getElementById('itemHand').textContent = inv[selSlot].emoji;
  } else {
    document.getElementById('itemHand').textContent = '--';
  }
}

function useInvItem() {
  if (selSlot < 0 || !inv[selSlot]) return;
  const item = inv[selSlot];
  if (item.id === 'flashlight') toggleFlash();
  else if (item.id === 'basement_key') {
    const bd = allDoors.find(d => d.id === 'basement');
    if (bd && bd.locked) {
      const dist = playerMesh.position.distanceTo(bd.pos);
      if (dist < 2.5) {
        bd.locked = false;
        notify('Door unlocked!', 'good');
        playSnd('unlock');
        inv[selSlot] = null;
        updateInv();
      } else notify('Get closer', 'bad');
    }
  } else if (item.id === 'lockpick') {
    notify('Lockpick used', 'good');
    inv[selSlot] = null;
    updateInv();
  } else {
    notify(item.name + ' equipped', 'good');
  }
}

function dropInvItem() {
  if (selSlot < 0 || !inv[selSlot]) return;
  const item = inv[selSlot];
  makeItem(
    playerMesh.position.x + Math.sin(rotY),
    0.5,
    playerMesh.position.z + Math.cos(rotY),
    item.emoji, item.name, item.id
  );
  inv[selSlot] = null;
  selSlot = -1;
  updateInv();
  notify('Item dropped');
}
// ===== EVENTS =====
function setupEvents() {
  // Menu
  document.getElementById('btnPlay').addEventListener('click', startGame);
  document.getElementById('btnSettings').addEventListener('click', () => document.getElementById('settingsPanel').classList.add('active'));
  document.getElementById('btnSetBack').addEventListener('click', () => document.getElementById('settingsPanel').classList.remove('active'));
  document.getElementById('btnControls').addEventListener('click', () => notify('Left stick=move | Right area=look | Buttons=actions'));

  // Settings
  document.getElementById('sensSlider').addEventListener('input', e => cfg.sens = parseInt(e.target.value));
  document.getElementById('volSlider').addEventListener('input', e => cfg.vol = parseInt(e.target.value) / 10);
  ['Quality','Shadows','Vibro'].forEach(s => {
    document.getElementById('tog' + s).addEventListener('click', function() {
      this.classList.toggle('on');
    });
  });

  // Action buttons - touch + mouse
  const bindBtn = (id, fn) => {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); fn(); }, {passive:false});
    el.addEventListener('mousedown', e => { e.preventDefault(); fn(); });
  };
  bindBtn('btnJump', doJump);
  bindBtn('btnCrouch', doCrouch);
  bindBtn('btnUse', doInteract);
  bindBtn('btnInv', toggleInv);
  bindBtn('btnFlash', toggleFlash);

  // Inventory
  document.getElementById('btnUseItem').addEventListener('click', useInvItem);
  document.getElementById('btnDropItem').addEventListener('click', dropInvItem);
  document.getElementById('btnCloseInv').addEventListener('click', toggleInv);

  // Screens
  document.getElementById('btnRespawn').addEventListener('click', doRespawn);
  document.getElementById('btnResume').addEventListener('click', togglePause);
  document.getElementById('btnRestart').addEventListener('click', doRestart);
  document.getElementById('btnQuit').addEventListener('click', doQuit);

  // Joystick
  const stickZone = document.getElementById('stickZone');
  const stickKnob = document.getElementById('stickKnob');

  stickZone.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.touches[0];
    stick.active = true;
    stick.ox = stickZone.getBoundingClientRect().left + 65;
    stick.oy = stickZone.getBoundingClientRect().top + 65;
    updateStick(t.clientX, t.clientY);
  }, {passive:false});

  stickZone.addEventListener('touchmove', e => {
    e.preventDefault();
    if (!stick.active) return;
    const t = e.touches[0];
    updateStick(t.clientX, t.clientY);
  }, {passive:false});

  const endStick = () => {
    stick.active = false;
    stick.dx = 0;
    stick.dy = 0;
    stickKnob.style.transform = 'translate(0px, 0px)';
  };
  stickZone.addEventListener('touchend', endStick);
  stickZone.addEventListener('touchcancel', endStick);

  function updateStick(cx, cy) {
    let dx = cx - stick.ox;
    let dy = cy - stick.oy;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const max = 40;
    if (dist > max) {
      dx = (dx / dist) * max;
      dy = (dy / dist) * max;
    }
    stick.dx = dx / max;
    stick.dy = dy / max;
    stickKnob.style.transform = 'translate(' + dx + 'px, ' + dy + 'px)';
  }

  // Camera zone
  const camZone = document.getElementById('camZone');
  camZone.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.touches[0];
    camTouch.active = true;
    camTouch.lx = t.clientX;
    camTouch.ly = t.clientY;
  }, {passive:false});

  camZone.addEventListener('touchmove', e => {
    e.preventDefault();
    if (!camTouch.active) return;
    const t = e.touches[0];
    const dx = t.clientX - camTouch.lx;
    const dy = t.clientY - camTouch.ly;
    const sens = cfg.sens * 0.003;
    rotY -= dx * sens;
    rotX -= dy * sens;
    rotX = Math.max(-1.2, Math.min(1.2, rotX));
    camTouch.lx = t.clientX;
    camTouch.ly = t.clientY;
  }, {passive:false});

  camZone.addEventListener('touchend', () => camTouch.active = false);
  camZone.addEventListener('touchcancel', () => camTouch.active = false);

  // Double tap to run
  let lastTap = 0;
  document.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - lastTap < 250) {
      sprinting = !sprinting;
      notify(sprinting ? 'Sprint ON' : 'Sprint OFF');
    }
    lastTap = now;
  });

  // Keyboard
  document.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'Space') doJump();
    if (e.code === 'KeyC') doCrouch();
    if (e.code === 'KeyE') doInteract();
    if (e.code === 'KeyI' || e.code === 'Tab') toggleInv();
    if (e.code === 'KeyF') toggleFlash();
    if (e.code === 'ShiftLeft') sprinting = true;
    if (e.code === 'Escape') togglePause();
  });

  document.addEventListener('keyup', e => {
    keys[e.code] = false;
    if (e.code === 'ShiftLeft') sprinting = false;
  });

  // Resize
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // Gamepad
  window.addEventListener('gamepadconnected', () => {
    notify('Gamepad connected!');
  });
}

// ===== GAME ACTIONS =====
function startGame() {
  document.getElementById('mainMenu').classList.add('hidden');
  document.getElementById('hud').classList.add('on');
  isRunning = true;
  isPaused = false;
  playMusic();
}

function doQuit() {
  isRunning = false;
  document.getElementById('hud').classList.remove('on');
  document.getElementById('pauseMenu').classList.remove('on');
  document.getElementById('mainMenu').classList.remove('hidden');
}

function doRestart() {
  // Reset player
  playerBody.position.set(-8, 1, 8);
  playerBody.velocity.set(0, 0, 0);
  playerBody.angularVelocity.set(0, 0, 0);
  hp = 100;
  noise = 0;
  crouching = false;
  sprinting = false;
  flashOn = false;
  flashLight.intensity = 0;

  // Reset neighbor
  neighborBody.position.set(2, 0.5, 0);
  neighborBody.velocity.set(0, 0, 0);
  nState = 'patrol';
  nPatrol = 0;
  nSuspicion = 0;
  nChaseTimer = 0;
  nLastPos = null;

  // Reset items
  allItems.forEach(it => {
    if (it.isItem && it.collected) {
      it.collected = false;
      it.mesh.visible = true;
      it.light.visible = true;
    }
  });

  // Reset doors
  allDoors.forEach(d => {
    d.open = false;
    d.angle = 0;
    d.targetAngle = 0;
    d.mesh.rotation.y = 0;
  });

  // Reset inv
  inv = [];
  selSlot = -1;
  updateInv();

  // Reset traps
  nTraps.forEach(t => t.active = true);

  document.getElementById('caughtScreen').classList.remove('on');
  document.getElementById('pauseMenu').classList.remove('on');
  isPaused = false;
  notify('Game restarted');
}

function doRespawn() {
  playerBody.position.set(-8, 1, 8);
  playerBody.velocity.set(0, 0, 0);
  hp = 100;
  noise = 0;
  document.getElementById('caughtScreen').classList.remove('on');
  nState = 'return';
  nChaseTimer = 0;
  isRunning = true;
  notify('Respawned');
}

function doJump() {
  if (canJump && Math.abs(playerBody.velocity.y) < 0.3) {
    playerBody.velocity.y = 6;
    canJump = false;
    noise = Math.min(100, noise + 15);
    playSnd('jump');
    setTimeout(() => canJump = true, 400);
  }
}

function doCrouch() {
  crouching = !crouching;
  const btn = document.getElementById('btnCrouch');
  if (crouching) {
    btn.classList.add('on');
    playerMesh.scale.y = 0.6;
  } else {
    btn.classList.remove('on');
    playerMesh.scale.y = 1;
  }
}

function toggleFlash() {
  flashOn = !flashOn;
  flashLight.intensity = flashOn ? 2 : 0;
  document.getElementById('btnFlash').classList.toggle('on', flashOn);
  playSnd('click');
}

function toggleInv() {
  const p = document.getElementById('invPanel');
  p.classList.toggle('on');
  isPaused = p.classList.contains('on');
}

function togglePause() {
  if (!isRunning) return;
  isPaused = !isPaused;
  document.getElementById('pauseMenu').classList.toggle('on', isPaused);
}

function doInteract() {
  const reach = 2.5;
  const px = playerBody.position.x;
  const py = playerBody.position.y;
  const pz = playerBody.position.z;
  const ppos = new THREE.Vector3(px, py, pz);

  // Doors
  for (let d of allDoors) {
    const dist = ppos.distanceTo(d.pos);
    if (dist < reach) {
      if (d.locked) {
        notify('Locked! Need key.', 'bad');
        playSnd('locked');
        return;
      }
      d.open = !d.open;
      d.targetAngle = d.open ? Math.PI/2 : 0;
      playSnd(d.open ? 'door_open' : 'door_close');
      noise = Math.min(100, noise + (d.open ? 20 : 10));
      return;
    }
  }

  // Items
  for (let it of allItems) {
    if (!it.isItem || it.collected) continue;
    const dist = ppos.distanceTo(it.pos);
    if (dist < reach) {
      if (addInv({ emoji: it.emoji, name: it.name, id: it.id, count: 1 })) {
        it.collected = true;
        it.mesh.visible = false;
        it.light.visible = false;
      }
      return;
    }
  }

  // Furniture
  for (let it of allItems) {
    if (it.isItem) continue;
    const dist = ppos.distanceTo(it.mesh.position);
    if (dist < reach) {
      if (it.type === 'fridge') { notify('Fridge is empty'); playSnd('fridge'); }
      else if (it.type === 'tv') notify('TV is broken');
      else if (it.type === 'bed') notify('Cannot sleep now');
      return;
    }
  }

  notify('Nothing here');
}

// ===== AI =====
const PATROLS = [
  new THREE.Vector3(2, 0, 0),
  new THREE.Vector3(-2, 0, 2),
  new THREE.Vector3(2, 0, -2),
  new THREE.Vector3(-2, 0, -2),
  new THREE.Vector3(0, 3.5, 0),
  new THREE.Vector3(3, 3.5, -2)
];

function updateAI(dt) {
  const nx = neighborBody.position.x;
  const nz = neighborBody.position.z;
  const npos = new THREE.Vector3(nx, 0, nz);
  const px = playerBody.position.x;
  const pz = playerBody.position.z;
  const ppos = new THREE.Vector3(px, 0, pz);
  const dist = npos.distanceTo(ppos);

  switch(nState) {
    case 'patrol':
      neighborMesh.children[5].visible = false;
      nChaseTimer = 0;
      const target = PATROLS[nPatrol];
      moveBody(neighborBody, target, 2, dt);
      if (npos.distanceTo(target) < 1) nPatrol = (nPatrol + 1) % PATROLS.length;
      if (noise > 50 || dist < 4) {
        nState = 'alert';
        nSuspicion = 40;
        nLastPos = ppos.clone();
        notify('Neighbor heard you!', 'bad');
        playSnd('alert');
      }
      break;

    case 'alert':
      neighborMesh.children[5].visible = true;
      neighborMesh.children[5].material.color.setHex(0xffff00);
      if (nLastPos) {
        moveBody(neighborBody, nLastPos, 3, dt);
        if (npos.distanceTo(nLastPos) < 1) {
          nSuspicion -= dt * 15;
          if (nSuspicion <= 0) { nState = 'patrol'; nLastPos = null; }
        }
      }
      if (dist < 3) {
        nState = 'chase';
        nChaseTimer = 8;
        notify('RUN! HE SAW YOU!', 'bad');
        playSnd('chase');
        if (cfg.vibrate && navigator.vibrate) navigator.vibrate([200,100,200]);
      }
      break;

    case 'chase':
      neighborMesh.children[5].visible = true;
      neighborMesh.children[5].material.color.setHex(0xff0000);
      nChaseTimer -= dt;
      moveBody(neighborBody, ppos, 5, dt);
      if (dist < 1.3) { doCatch(); return; }
      if (nChaseTimer <= 0) { nState = 'return'; }
      break;

    case 'return':
      neighborMesh.children[5].visible = false;
      moveBody(neighborBody, PATROLS[0], 2.5, dt);
      if (npos.distanceTo(PATROLS[0]) < 1) { nState = 'patrol'; nPatrol = 0; }
      break;
  }

  // Sync mesh
  neighborMesh.position.set(nx, 0, nz);
  const v = neighborBody.velocity;
  if (Math.abs(v.x) > 0.1 || Math.abs(v.z) > 0.1) {
    neighborMesh.rotation.y = Math.atan2(v.x, v.z);
  }

  // Traps
  for (let t of nTraps) {
    if (!t.active) continue;
    if (ppos.distanceTo(t.pos) < 0.7) {
      t.active = false;
      t.mesh.material.color.setHex(0x333333);
      hp -= 25;
      notify('TRAP!', 'bad');
      playSnd('trap');
      if (cfg.vibrate && navigator.vibrate) navigator.vibrate(300);
      nState = 'chase';
      nChaseTimer = 6;
      if (hp <= 0) doCatch();
    }
  }
}

function moveBody(body, target, speed, dt) {
  const dx = target.x - body.position.x;
  const dz = target.z - body.position.z;
  const dist = Math.sqrt(dx*dx + dz*dz);
  if (dist > 0.3) {
    body.velocity.x = (dx / dist) * speed;
    body.velocity.z = (dz / dist) * speed;
  } else {
    body.velocity.x *= 0.5;
    body.velocity.z *= 0.5;
  }
}

function doCatch() {
  isRunning = false;
  document.getElementById('caughtScreen').classList.add('on');
  playSnd('caught');
  if (cfg.vibrate && navigator.vibrate) navigator.vibrate([500,200,500,200,500]);
}
// ===== MAIN LOOP =====
function loop(time) {
  requestAnimationFrame(loop);

  // FPS limit
  const elapsed = time - lastT;
  if (elapsed < 1000 / cfg.fps) {
    // Still render for smoothness but skip physics
    if (scene && camera) renderer.render(scene, camera);
    return;
  }
  lastT = time - (elapsed % (1000 / cfg.fps));
  const dt = Math.min(elapsed / 1000, 0.05);

  // FPS counter
  fpsCount++;
  fpsAccum += elapsed;
  if (fpsAccum >= 1000) {
    document.getElementById('fps').textContent = 'FPS: ' + fpsCount;
    fpsCount = 0;
    fpsAccum = 0;
  }

  // Always render scene
  renderer.render(scene, camera);

  if (!isRunning || isPaused) return;

  // Physics
  world.step(dt, 3, 3);

  // Update player
  updatePlayer(dt);

  // Update AI
  updateAI(dt);

  // Update doors
  allDoors.forEach(d => {
    d.angle += (d.targetAngle - d.angle) * 6 * dt;
    d.mesh.rotation.y = d.angle;
  });

  // Update items animation
  allItems.forEach(it => {
    if (it.isItem && !it.collected) {
      it.mesh.position.y = it.pos.y + Math.sin(time * 0.002 + it.pos.x) * 0.15;
    }
  });

  // Sync physics boxes
  allBoxes.forEach(b => {
    b.mesh.position.copy(b.body.position);
    b.mesh.quaternion.copy(b.body.quaternion);
  });

  // Noise decay
  noise = Math.max(0, noise - dt * 12);
  document.getElementById('noiseFill').style.width = noise + '%';
  document.getElementById('hpText').textContent = Math.ceil(hp) + '%';

  // Flashlight position
  if (flashLight) {
    const p = playerBody.position;
    flashLight.position.set(p.x, p.y + 1.2, p.z);
    flashLight.target.position.set(
      p.x + Math.sin(rotY) * Math.cos(rotX),
      p.y + 1.2 + Math.sin(rotX),
      p.z + Math.cos(rotY) * Math.cos(rotX)
    );
  }

  // Gamepad
  const gp = navigator.getGamepads ? navigator.getGamepads()[0] : null;
  if (gp) {
    stick.dx = gp.axes[0] || 0;
    stick.dy = gp.axes[1] || 0;
    if (Math.abs(stick.dx) < 0.1) stick.dx = 0;
    if (Math.abs(stick.dy) < 0.1) stick.dy = 0;
    rotY -= (gp.axes[2] || 0) * 0.04;
    rotX -= (gp.axes[3] || 0) * 0.04;
    rotX = Math.max(-1.2, Math.min(1.2, rotX));
    if (gp.buttons[0].pressed) doJump();
    if (gp.buttons[1].pressed) doCrouch();
    if (gp.buttons[2].pressed) doInteract();
    if (gp.buttons[3].pressed) toggleFlash();
    if (gp.buttons[9].pressed) togglePause();
  }

  // Win check
  const bd = allDoors.find(d => d.id === 'basement');
  if (bd && bd.open && !bd.locked) {
    const d = new THREE.Vector3(playerBody.position.x, 0, playerBody.position.z).distanceTo(bd.pos);
    if (d < 1.5) {
      notify('VICTORY! Basement entered!', 'good');
      isRunning = false;
    }
  }
}

function updatePlayer(dt) {
  // Get input
  let mx = 0, mz = 0;

  if (stick.active) {
    mx = stick.dx;
    mz = stick.dy;
  } else {
    if (keys['KeyW'] || keys['ArrowUp']) mz -= 1;
    if (keys['KeyS'] || keys['ArrowDown']) mz += 1;
    if (keys['KeyA'] || keys['ArrowLeft']) mx -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) mx += 1;
  }

  // Normalize
  const len = Math.sqrt(mx*mx + mz*mz);
  if (len > 1) { mx /= len; mz /= len; }

  // Speed
  const spd = sprinting ? 6 : (crouching ? 1.5 : 3.5);

  // Direction relative to camera
  const fx = Math.sin(rotY);
  const fz = Math.cos(rotY);
  const rx = Math.cos(rotY);
  const rz = -Math.sin(rotY);

  // Apply velocity directly (no damping issues)
  const vx = (fx * (-mz) + rx * mx) * spd;
  const vz = (fz * (-mz) + rz * mx) * spd;

  playerBody.velocity.x = vx;
  playerBody.velocity.z = vz;

  // Noise
  if (len > 0.1) {
    noise = Math.min(100, noise + (sprinting ? 1.0 : (crouching ? 0.15 : 0.5)));
  }

  // Sync mesh to body
  const pb = playerBody.position;
  playerMesh.position.set(pb.x, pb.y - 0.9, pb.z);
  playerMesh.rotation.y = rotY;

  // Camera position
  camera.position.set(pb.x, pb.y + (crouching ? 0.6 : 1.5), pb.z);

  // Camera rotation using quaternion (CORRECT WAY)
  camera.quaternion.setFromEuler(new THREE.Euler(rotX, rotY, 0, 'YXZ'));

  // Fall reset
  if (pb.y < -5) {
    playerBody.position.set(-8, 1, 8);
    playerBody.velocity.set(0, 0, 0);
  }
}

// ===== AUDIO =====
function setupAudio() {
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
}

function playSnd(type) {
  if (!audioCtx || cfg.vol <= 0) return;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.connect(g);
  g.connect(audioCtx.destination);
  const now = audioCtx.currentTime;
  const v = cfg.vol;

  switch(type) {
    case 'jump':
      osc.frequency.setValueAtTime(300, now);
      osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
      g.gain.setValueAtTime(0.3 * v, now);
      g.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
      osc.start(now); osc.stop(now + 0.1);
      break;
    case 'click':
      osc.frequency.setValueAtTime(1000, now);
      g.gain.setValueAtTime(0.15 * v, now);
      g.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
      osc.start(now); osc.stop(now + 0.05);
      break;
    case 'door_open':
      osc.frequency.setValueAtTime(400, now);
      osc.frequency.linearRampToValueAtTime(200, now + 0.25);
      g.gain.setValueAtTime(0.2 * v, now);
      g.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
      osc.start(now); osc.stop(now + 0.25);
      break;
    case 'door_close':
      osc.frequency.setValueAtTime(200, now);
      osc.frequency.linearRampToValueAtTime(100, now + 0.15);
      g.gain.setValueAtTime(0.2 * v, now);
      g.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
      osc.start(now); osc.stop(now + 0.15);
      break;
    case 'locked':
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(200, now);
      g.gain.setValueAtTime(0.25 * v, now);
      g.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
      osc.start(now); osc.stop(now + 0.1);
      break;
    case 'pickup':
      osc.frequency.setValueAtTime(800, now);
      osc.frequency.exponentialRampToValueAtTime(1500, now + 0.15);
      g.gain.setValueAtTime(0.2 * v, now);
      g.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
      osc.start(now); osc.stop(now + 0.15);
      break;
    case 'alert':
      osc.type = 'square';
      osc.frequency.setValueAtTime(500, now);
      osc.frequency.setValueAtTime(700, now + 0.1);
      g.gain.setValueAtTime(0.25 * v, now);
      g.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
      osc.start(now); osc.stop(now + 0.25);
      break;
    case 'chase':
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(300, now);
      for (let i = 0; i < 4; i++) osc.frequency.setValueAtTime(300 + i * 150, now + i * 0.08);
      g.gain.setValueAtTime(0.3 * v, now);
      g.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
      osc.start(now); osc.stop(now + 0.35);
      break;
    case 'caught':
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150, now);
      for (let i = 0; i < 8; i++) osc.frequency.setValueAtTime(150 - i * 10, now + i * 0.08);
      g.gain.setValueAtTime(0.35 * v, now);
      g.gain.exponentialRampToValueAtTime(0.01, now + 0.7);
      osc.start(now); osc.stop(now + 0.7);
      break;
    case 'trap':
      osc.type = 'square';
      osc.frequency.setValueAtTime(1000, now);
      osc.frequency.exponentialRampToValueAtTime(300, now + 0.25);
      g.gain.setValueAtTime(0.3 * v, now);
      g.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
      osc.start(now); osc.stop(now + 0.25);
      break;
    case 'unlock':
      osc.frequency.setValueAtTime(600, now);
      osc.frequency.exponentialRampToValueAtTime(1000, now + 0.2);
      g.gain.setValueAtTime(0.2 * v, now);
      g.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
      osc.start(now); osc.stop(now + 0.2);
      break;
    case 'fridge':
      osc.frequency.setValueAtTime(100, now);
      g.gain.setValueAtTime(0.1 * v, now);
      g.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
      osc.start(now); osc.stop(now + 0.15);
      break;
  }
}

function playMusic() {
  if (!audioCtx) return;
  const o1 = audioCtx.createOscillator();
  const o2 = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o1.type = 'sine';
  o1.frequency.setValueAtTime(55, audioCtx.currentTime);
  o2.type = 'sine';
  o2.frequency.setValueAtTime(82.5, audioCtx.currentTime);
  g.gain.setValueAtTime(0.04 * cfg.vol, audioCtx.currentTime);
  o1.connect(g);
  o2.connect(g);
  g.connect(audioCtx.destination);
  o1.start();
  o2.start();
}

// ===== UTILS =====
function notify(text, type) {
  type = type || '';
  const area = document.getElementById('notifArea');
  const n = document.createElement('div');
  n.className = 'notif ' + type;
  n.textContent = text;
  area.appendChild(n);
  setTimeout(() => {
    n.style.opacity = '0';
    n.style.transform = 'translateY(-10px)';
    setTimeout(() => n.remove(), 300);
  }, 2500);
}

// Start
window.addEventListener('load', init);
</script>
