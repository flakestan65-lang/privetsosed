<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шерлок - поиск данных</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', monospace;
        }
        body {
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: #00ffcc;
        }
        .container {
            background: rgba(10, 10, 10, 0.9);
            border: 1px solid #00ffcc;
            border-radius: 12px;
            padding: 40px 50px;
            width: 600px;
            max-width: 95%;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.2);
            backdrop-filter: blur(4px);
        }
        h1 {
            font-size: 32px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #00ffcc;
            text-shadow: 0 0 20px #00ffcc88;
            margin-bottom: 10px;
        }
        .sub {
            text-align: center;
            font-size: 14px;
            color: #88ffdd;
            margin-bottom: 30px;
            border-bottom: 1px dashed #00ffcc44;
            padding-bottom: 15px;
        }
        label {
            display: block;
            font-size: 14px;
            margin-top: 20px;
            color: #88ffdd;
        }
        input, select {
            width: 100%;
            padding: 12px 15px;
            background: #111;
            border: 1px solid #00ffcc66;
            border-radius: 8px;
            color: #00ffcc;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }
        input:focus, select:focus {
            border-color: #00ffcc;
            box-shadow: 0 0 20px #00ffcc44;
        }
        .btn {
            width: 100%;
            padding: 14px;
            margin-top: 30px;
            background: #00ffcc;
            color: #0a0a0a;
            font-weight: bold;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.3s;
        }
        .btn:hover {
            background: #00ddbb;
            box-shadow: 0 0 40px #00ffcc88;
            transform: scale(1.02);
        }
        #result {
            margin-top: 30px;
            background: #111;
            border: 1px solid #00ffcc44;
            border-radius: 8px;
            padding: 20px;
            min-height: 100px;
            font-size: 14px;
            white-space: pre-wrap;
            word-break: break-all;
            color: #bbffee;
            max-height: 300px;
            overflow-y: auto;
        }
        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #00ffcc66;
            text-align: center;
        }
        .status {
            color: #ffaa00;
            font-size: 13px;
            margin-top: 8px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🕵️ ШЕРЛОК</h1>
    <div class="sub">поиск по открытым источникам</div>

    <label for="query">📌 Логин / Email / Телефон</label>
    <input type="text" id="query" placeholder="введите ник, почту или номер" value="testuser">

    <label for="service">🌐 Платформа</label>
    <select id="service">
        <option value="all">Все (медленно)</option>
        <option value="github">GitHub</option>
        <option value="twitter">Twitter / X</option>
        <option value="instagram">Instagram</option>
        <option value="vk">VK</option>
        <option value="telegram">Telegram</option>
        <option value="reddit">Reddit</option>
    </select>

    <button class="btn" id="searchBtn">🔍 Найти следы</button>

    <div id="result">╰┈➤ ожидаю команды, босс...</div>
    <div class="status" id="status"></div>
    <div class="footer">🔒 данные имитируются — для реального шерлока нужен бэкенд на Python</div>
</div>

<script>
    (function() {
        // Имитация ответа шерлока — хуйня, но для демки сойдёт
        const mockData = {
            "testuser": {
                "github": "https://github.com/testuser — репозитории: 12, фолловеров: 340",
                "twitter": "@testuser — твитов: 1.2к, подписок: 450",
                "instagram": "instagram.com/testuser — 560 публикаций, 3.2к подписчиков",
                "vk": "vk.com/testuser — друзей: 189, групп: 23",
                "telegram": "@testuser — канал: 890 подписчиков",
                "reddit": "u/testuser — карма: 2.4к, постов: 67"
            },
            "admin": {
                "github": "github.com/admin — 45 репозиториев, 1.2к звёзд",
                "twitter": "@admin — защищённый аккаунт",
                "instagram": "instagram.com/admin — 0 публикаций",
                "vk": "vk.com/admin — скрыт",
                "telegram": "@admin — бот, 12к юзеров",
                "reddit": "u/admin — модератор 5 сабреддитов"
            }
        };

        const queryInput = document.getElementById('query');
        const serviceSelect = document.getElementById('service');
        const resultDiv = document.getElementById('result');
        const statusDiv = document.getElementById('status');
        const searchBtn = document.getElementById('searchBtn');

        function search(query, service) {
            if (!query.trim()) {
                return "❌ Блять, введи что-то, а не пустоту!";
            }

            // Ищем по мокам
            let found = mockData[query.toLowerCase()];
            if (!found) {
                // Если нет точного совпадения — генерируем рандомный ответ
                return `🔍 По запросу "${query}" ничего не найдено в открытых источниках.\nВозможно, аккаунт скрыт или ты ввел хуйню, ишак.`;
            }

            if (service === 'all') {
                let output = `🕵️ Результаты для "${query}":\n\n`;
                for (const [key, val] of Object.entries(found)) {
                    output += `▸ ${key.toUpperCase()}: ${val}\n`;
                }
                return output;
            }

            // Конкретный сервис
            if (found[service]) {
                return `🕵️ ${service.toUpperCase()} для "${query}":\n${found[service]}`;
            } else {
                return `❌ На ${service} пользователь "${query}" не найден, сука.`;
            }
        }

        searchBtn.addEventListener('click', function() {
            const query = queryInput.value.trim();
            const service = serviceSelect.value;
            if (!query) {
                resultDiv.textContent = "❗ Ты блять долбаёб? Введи данные для поиска!";
                statusDiv.textContent = "⛔ ошибка: пустой запрос";
                return;
            }

            statusDiv.textContent = "⏳ сканирую...";
            resultDiv.textContent = "⏳ Идёт поиск, нахуй...";

            // Имитация задержки, как будто шерлок думает
            setTimeout(() => {
                const result = search(query, service);
                resultDiv.textContent = result;
                statusDiv.textContent = "✅ готово, сука";
            }, 800 + Math.random() * 600);
        });

        // Если нажать Enter — тоже ищем
        queryInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchBtn.click();
            }
        });
    })();
</script>
</body>
</html>
