<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>macOS Sonoma — Симуляция</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    :root {
        --accent: #0071E3;
        --bg-window: rgba(255,255,255,0.72);
        --bg-sidebar: rgba(246,246,246,0.85);
        --text-primary: #1c1c1e;
        --menubar-bg: rgba(255,255,255,0.6);
        --dock-bg: rgba(255,255,255,0.2);
    }
    .dark {
        --bg-window: rgba(30,30,30,0.8);
        --bg-sidebar: rgba(44,44,44,0.9);
        --text-primary: #f5f5f7;
        --menubar-bg: rgba(0,0,0,0.5);
        --dock-bg: rgba(255,255,255,0.12);
    }

    * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
        overflow: hidden;
        height: 100vh;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 30%, #0f3460 60%, #533483 100%);
        color: var(--text-primary);
        position: relative;
    }

    #menubar {
        position: fixed; top: 0; left: 0; right: 0;
        height: 28px;
        background: var(--menubar-bg);
        backdrop-filter: blur(20px);
        display: flex; align-items: center;
        padding: 0 12px;
        z-index: 10000;
        font-size: 13px;
    }
    #apple-menu { font-weight: bold; cursor: pointer; padding: 0 8px; }
    #right-tray { margin-left: auto; display: flex; align-items: center; gap: 12px; }

    #dock {
        position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
        background: var(--dock-bg);
        backdrop-filter: blur(30px);
        border-radius: 20px;
        padding: 6px 12px;
        display: flex; gap: 8px;
        z-index: 9000;
    }
    .dock-icon {
        width: 52px; height: 52px;
        background-size: cover;
        border-radius: 18px;
        cursor: pointer;
    }

    .window {
        position: absolute;
        background: var(--bg-window);
        backdrop-filter: blur(40px);
        border-radius: 12px;
        box-shadow: 0 22px 70px rgba(0,0,0,0.35);
        overflow: hidden;
        z-index: 100;
    }
    .titlebar {
        height: 28px;
        display: flex; align-items: center;
        padding: 0 12px;
        position: relative;
        -webkit-app-region: drag;
    }
    .traffic-lights { display: flex; gap: 8px; }
    .light { width: 12px; height: 12px; border-radius: 50%; }
    .close { background: #FF5F57; }
    .minimize { background: #FEBC2E; }
    .maximize { background: #28C840; }
    .title { position: absolute; left: 50%; transform: translateX(-50%); font-weight: 600; }
</style>
</head>
<body>

<!-- Меню-бар -->
<div id="menubar">
    <div id="apple-menu" onclick="toggleAppleMenu()"></div>
    <div class="menu-item">Finder</div>
    <div id="right-tray">
        <span onclick="toggleSpotlight()">🔍</span>
        <span id="clock"></span>
    </div>
</div>

<!-- Док -->
<div id="dock">
    <div class="dock-icon" onclick="openApp('finder')">F</div>
    <div class="dock-icon" onclick="openApp('terminal')">T</div>
</div>

<!-- Окно Finder -->
<div id="finder-window" class="window" style="width:780px;height:520px;top:80px;left:200px;display:none;">
    <div class="titlebar">
        <div class="traffic-lights">
            <div class="light close" onclick="closeWindow(this)"></div>
            <div class="light minimize"></div>
            <div class="light maximize"></div>
        </div>
        <div class="title">Finder</div>
    </div>
    <div style="padding:20px;">Содержимое Finder...</div>
</div>

<!-- Окно Terminal -->
<div id="terminal-window" class="window" style="width:720px;height:450px;top:120px;left:300px;display:none;">
    <div class="titlebar">
        <div class="traffic-lights">
            <div class="light close" onclick="closeWindow(this)"></div>
        </div>
        <div class="title">Terminal</div>
    </div>
    <div id="terminal" style="background:#1E1E1E;color:#0F0;padding:12px;height:calc(100% - 28px);font-family:monospace;overflow:auto;"></div>
</div>

<script>
function updateClock() {
    setInterval(() => {
        document.getElementById('clock').textContent = new Date().toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
    }, 1000);
}
updateClock();

function openApp(app) {
    if (app === 'finder') document.getElementById('finder-window').style.display = 'block';
    if (app === 'terminal') {
        const t = document.getElementById('terminal-window');
        t.style.display = 'block';
        document.getElementById('terminal').innerHTML = 'user@MacBook ~ % <br>';
    }
}

function closeWindow(el) {
    el.closest('.window').style.display = 'none';
}

function toggleSpotlight() {
    alert('Spotlight открыт (имитация Cmd + Space)');
}

function toggleAppleMenu() {
    alert(' Меню macOS\nО Mac\nСистемные настройки...\nСпящий режим / Перезагрузка / Выключение');
}

// Перетаскивание окон
document.querySelectorAll('.window').forEach(win => {
    let dragging = false, x, y;
    win.querySelector('.titlebar').addEventListener('mousedown', e => {
        if (e.target.classList.contains('light')) return;
        dragging = true;
        x = e.clientX - win.offsetLeft;
        y = e.clientY - win.offsetTop;
    });
    document.addEventListener('mousemove', e => {
        if (dragging) {
            win.style.left = (e.clientX - x) + 'px';
            win.style.top = (e.clientY - y) + 'px';
        }
    });
    document.addEventListener('mouseup', () => dragging = false);
});

document.addEventListener('keydown', e => {
    if (e.metaKey && e.key === ' ') toggleSpotlight();
});
</script>
</body>
</html>
