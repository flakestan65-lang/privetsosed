<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🕵️ Шерлок - Поиск данных</title>
    <style>
        /* ВСЕ СТИЛИ ТУТ (чтобы не ебаться с отдельным файлом) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', monospace;
        }
        
        body {
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: #00ffcc;
            padding: 20px;
        }
        
        .container {
            background: rgba(10, 10, 10, 0.95);
            border: 2px solid #00ffcc;
            border-radius: 16px;
            padding: 40px;
            width: 700px;
            max-width: 100%;
            box-shadow: 0 0 60px rgba(0, 255, 204, 0.15);
        }
        
        h1 {
            font-size: 36px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 6px;
            color: #00ffcc;
            text-shadow: 0 0 30px rgba(0, 255, 204, 0.3);
            margin-bottom: 5px;
        }
        
        .subtitle {
            text-align: center;
            font-size: 14px;
            color: #88ffdd;
            opacity: 0.7;
            margin-bottom: 30px;
            border-bottom: 1px dashed rgba(0, 255, 204, 0.2);
            padding-bottom: 15px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            font-size: 13px;
            color: #88ffdd;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        input, select {
            width: 100%;
            padding: 14px 18px;
            background: #111;
            border: 1px solid rgba(0, 255, 204, 0.3);
            border-radius: 10px;
            color: #00ffcc;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
        }
        
        input:focus, select:focus {
            border-color: #00ffcc;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.1);
        }
        
        input::placeholder {
            color: #446655;
        }
        
        .btn {
            width: 100%;
            padding: 16px;
            margin-top: 10px;
            background: #00ffcc;
            color: #0a0a0a;
            font-weight: bold;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 3px;
            transition: all 0.3s;
        }
        
        .btn:hover {
            background: #00ddbb;
            box-shadow: 0 0 50px rgba(0, 255, 204, 0.3);
            transform: scale(1.01);
        }
        
        .btn:active {
            transform: scale(0.98);
        }
        
        #result {
            margin-top: 25px;
            background: #0d0d0d;
            border: 1px solid rgba(0, 255, 204, 0.15);
            border-radius: 10px;
            padding: 20px;
            min-height: 120px;
            font-size: 14px;
            white-space: pre-wrap;
            word-break: break-all;
            color: #bbffee;
            max-height: 400px;
            overflow-y: auto;
            line-height: 1.6;
        }
        
        #result::-webkit-scrollbar {
            width: 6px;
        }
        
        #result::-webkit-scrollbar-track {
            background: #0a0a0a;
        }
        
        #result::-webkit-scrollbar-thumb {
            background: #00ffcc;
            border-radius: 3px;
        }
        
        .status {
            margin-top: 12px;
            font-size: 13px;
            color: #ffaa00;
            text-align: center;
            min-height: 20px;
        }
        
        .footer {
            margin-top: 20px;
            font-size: 11px;
            color: rgba(0, 255, 204, 0.3);
            text-align: center;
            border-top: 1px solid rgba(0, 255, 204, 0.05);
            padding-top: 15px;
        }
        
        .badge {
            display: inline-block;
            background: rgba(0, 255, 204, 0.1);
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 11px;
            color: #00ffcc;
            margin-left: 5px;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            h1 {
                font-size: 24px;
                letter-spacing: 3px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🕵️ ШЕРЛОК</h1>
    <div class="subtitle">поиск по 300+ открытым источникам</div>
    
    <div class="input-group">
        <label for="username">📌 Логин / Email / Телефон</label>
        <input type="text" id="username" placeholder="введите ник, почту или номер" value="testuser">
    </div>
    
    <div class="input-group">
        <label for="platform">🌐 Платформа</label>
        <select id="platform">
            <option value="all">🌍 Все (медленно, но полно)</option>
            <option value="github">GitHub</option>
            <option value="twitter">Twitter / X</option>
            <option value="instagram">Instagram</option>
            <option value="vk">VK</option>
            <option value="telegram">Telegram</option>
            <option value="reddit">Reddit</option>
            <option value="youtube">YouTube</option>
            <option value="tiktok">TikTok</option>
        </select>
    </div>
    
    <button class="btn" id="searchBtn">🔍 ИСКАТЬ СЛЕДЫ</button>
    
    <div id="result">╰┈➤ ожидаю команды, босс...</div>
    <div class="status" id="status"></div>
    <div class="footer">
        ⚡ реальный поиск через оригинальный Sherlock
        <span class="badge">v2.0</span>
    </div>
</div>

<script>
    (function() {
        const usernameInput = document.getElementById('username');
        const platformSelect = document.getElementById('platform');
        const resultDiv = document.getElementById('result');
        const statusDiv = document.getElementById('status');
        const searchBtn = document.getElementById('searchBtn');
        
        function showStatus(text, isError = false) {
            statusDiv.textContent = text;
            statusDiv.style.color = isError ? '#ff4444' : '#ffaa00';
        }
        
        function search() {
            const username = usernameInput.value.trim();
            const platform = platformSelect.value;
            
            if (!username) {
                resultDiv.textContent = "❗ Ты блять долбаёб? Введи данные для поиска!";
                showStatus('⛔ ошибка: пустой запрос', true);
                return;
            }
            
            // Блокируем кнопку
            searchBtn.disabled = true;
            searchBtn.textContent = '⏳ ИЩУ...';
            resultDiv.textContent = '⏳ Сканирую 300+ сайтов, нахуй...';
            showStatus('⏳ выполняется поиск...');
            
            // Отправляем запрос
            fetch('/api/search', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    username: username,
                    platform: platform
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'error') {
                    resultDiv.textContent = '❌ ' + data.message;
                    showStatus('⛔ ошибка', true);
                } else {
                    // Показываем результат
                    if (data.data && data.data.formatted) {
                        resultDiv.textContent = data.data.formatted;
                    } else {
                        resultDiv.textContent = '🔍 Результат:\n' + JSON.stringify(data.data, null, 2);
                    }
                    showStatus('✅ готово, сука! Найдено ' + (data.data.total_found || 0) + ' совпадений');
                }
            })
            .catch(error => {
                resultDiv.textContent = '💀 КАТАСТРОФА: ' + error.message;
                showStatus('⛔ сервер упал, блять', true);
            })
            .finally(() => {
                // Разблокируем кнопку
                searchBtn.disabled = false;
                searchBtn.textContent = '🔍 ИСКАТЬ СЛЕДЫ';
            });
        }
        
        // Обработчики событий
        searchBtn.addEventListener('click', search);
        
        usernameInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                search();
            }
        });
        
        // Первый поиск при загрузке (для демонстрации)
        setTimeout(search, 500);
    })();
</script>
</body>
</html>
